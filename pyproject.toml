[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spxlab"
version = "0.1.0"
description = "Point-in-time SPXW shadow research with five counterfactual books"
requires-python = ">=3.12"
dependencies = ["ib_async==2.1.0"]

[project.scripts]
spxlab = "spxlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
